# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"

tone_instructions: >
  항상 한국어로 리뷰를 작성해줘. 존댓말을 사용하되 장황하지 않고 간결하게,
  요점만 명확히 짚어줘. 코드 스니펫이나 diff, 식별자(클래스/함수/변수명)는
  원문 그대로(영어) 유지하고 설명만 한국어로 작성해줘.

early_access: false

reviews:
  profile: "chill"
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false

  path_instructions:
    - path: "**/*"
      instructions: >
        이 프로젝트의 스택: Python 3.11+, FastAPI, Uvicorn, httpx(공유 AsyncClient),
        Pydantic v2 + pydantic-settings, Redis, uv. LLM은 Claude(Haiku 4.5 /
        Sonnet 4.6 / Opus 4.x)와 Gemini 3 Flash를 사원별로 차등 사용하며 OpenRouter로
        라우팅한다(primary/fallback 정책). LangChain은 사용하지 않고 OpenRouter를
        httpx로 직접 호출한다. 레이어는 api(HTTP 입구) → core/services(use-case) →
        core/agents(프롬프트·모델정책) · infra(외부 I/O)로 나뉜다. 이 구조·스택을
        기준으로 리뷰하고, 구버전 관례(Pydantic v1 BaseSettings/validator 등)를 최신
        표준이라 착각해 지적하지 않도록 주의해줘.

    - path: "**/*.py"
      instructions: >
        - 타입 힌트를 붙였는지 확인해줘(함수 시그니처·반환형). Pydantic v2 모델로
          입출력을 검증하는지 봐줘.
        - LLM API 키(OpenRouter), Redis 접속 정보 등 시크릿이 코드에 하드코딩되어
          있으면 반드시 지적하고 config/settings.py(pydantic-settings) 주입을 제안해줘.
        - 함수/변수는 snake_case, 클래스는 PascalCase, 상수는 UPPER_SNAKE_CASE를 따라야 한다.
        - async 엔드포인트/서비스 안에서 동기 blocking I/O를 그대로 호출하면 이벤트
          루프를 막으므로 지적해줘. 외부 호출은 공유 httpx.AsyncClient를 재사용하는지 봐줘.

    - path: "app/api/**/*.py"
      instructions: >
        api 레이어에는 비즈니스 로직을 두지 않고 요청/응답 검증과 core/services 위임만
        한다. 프롬프트 조립·LLM 호출 로직이 라우터에 직접 들어가 있으면 core로 옮기도록
        제안해줘. 요청/응답은 schemas의 Pydantic 모델을 사용해야 한다. 공유 의존성은
        api/deps.py를 통해 주입하는지 확인해줘.

    - path: "app/core/services/**/*.py"
      instructions: >
        service는 캐시 확인 → 프롬프트 조립 → LLM 호출 → 결과 파싱 흐름을 담당한다.
        브리핑 생성은 ROOKIE·TANKER·PRO를 asyncio.gather로 병렬 호출하는 패턴을 따른다.
        LLM 응답을 신뢰하고 그대로 반환하지 말고 정해진 JSON 스키마로 파싱·검증하는지,
        동일 입력(뉴스×사원타입×레벨대)에 대한 Redis 캐싱을 우회하지 않는지 확인해줘.

    - path: "app/core/agents/**/*.py"
      instructions: >
        사원 페르소나(agent_profiles)·모델 정책(model_policy)·프롬프트 조립
        (prompt_builder)·모델 라우팅(llm_router)을 담당한다. 프롬프트 문자열이나 모델명이
        services/api 등에 하드코딩되어 흩어져 있으면 이 레이어로 모으도록 제안해줘. 기본
        브리핑 프롬프트에는 특정 사용자 데이터(user_id 등)를 넣지 않아야 한다(전역 캐싱
        공유 자산). 개인화는 feedback 흐름에서 별도로 처리한다.

    - path: "app/infra/**/*.py"
      instructions: >
        infra는 외부 I/O(OpenRouter, Redis, HTTP) 전용이다. 여기에 도메인/비즈니스 로직이
        섞이지 않는지 확인해줘. openrouter_client는 타임아웃·재시도·fallback,
        usage_tracker는 사용량/성능 기록을 다룬다. 실패 경로(LLMTimeout·RateLimitError·
        AllModelsFailed 등 exceptions.py의 예외)를 적절히 던지고 처리하는지 봐줘.

    - path: "app/schemas/**/*.py"
      instructions: >
        백엔드(Spring Boot)와 주고받는 계약이다. 필드 추가/변경 시 서버 측 DTO와의
        호환성(필드명·필수 여부·타입)이 깨지지 않는지 신중히 봐줘.

  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: ""

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: "auto"
