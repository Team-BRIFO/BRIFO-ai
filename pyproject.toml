[project]
name = "brifo-ai"
version = "0.1.0"
description = "BRIFO AI Service - Multi-persona stock briefing service"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
